<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- PATH Planner favicon: the header's train mark, gold on the night-sky
       gradient (strokes slightly thickened vs the header logo so the mark
       stays readable at 16px) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1033" />
      <stop offset="1" stop-color="#252c57" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)" />
  <g
    transform="translate(15.2 15.2) scale(1.4)"
    fill="none"
    stroke="#f5d67b"
    stroke-width="2.2"
  >
    <rect x="5" y="3" width="14" height="15" rx="4" />
    <path d="M8 21l1.8-3M16 21l-1.8-3" stroke-linecap="round" />
    <circle cx="9.2" cy="12.4" r="1.8" fill="#f5d67b" stroke="none" />
    <circle cx="14.8" cy="12.4" r="1.8" fill="#f5d67b" stroke="none" />
  </g>
</svg>
